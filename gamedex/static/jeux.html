{{define "jeux"}}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Gamedex</title>
</head>
<body>
  {{range .}}
    <div>
      <h1>{{.Name}}</h1>
      <p>Année : {{.Year}}</p>
      <p>Studio : {{.Studio}}</p>
      <p>Lien vers la fiche du jeu <a href="http://localhost:3000/jeux/{{.ID}}">Clique ici</a></p>
    </div>
  {{else}}
    <p>Aucun jeu trouvé.</p>
  {{end}}
</body>
</html>
{{end}}
