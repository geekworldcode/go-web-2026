{{template "header" .}}

<h1>Liste des jeux</h1>

<form method="GET" action="/jeux">
  <input type="text" name="q" value="{{.Query}}" placeholder="Rechercher...">
  <label for="genre">Genre</label>
  <select name="genre" id="genre">
    <option value="">Tous les genres</option>
    {{range .Genres}}
      <option value="{{.}}"{{if eq . $.Genre}} selected{{end}}>{{.}}</option>
    {{end}}
  </select>
  <button type="submit">Chercher</button>
</form>

{{if .Query}}
  <p>Vous avez cherché : {{.Query}}</p>
{{end}}

<ul>
  {{range .Games}}
    <li><a href="/jeux/{{.ID}}">{{.Name}}</a> ({{.Year}})</li>
  {{else}}
    <li>Aucun jeu trouvé.</li>
  {{end}}
</ul>

{{template "footer" .}}
